spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tailorly}
    username: ${DATABASE_USERNAME:tailorly}
    password: ${DATABASE_PASSWORD:tailorly}

tailorly:
  security:
    jwt:
      # Chave conhecida e exclusiva do perfil local. Outros perfis continuam
      # exigindo TAILORLY_JWT_SECRET.
      secret: ${TAILORLY_JWT_SECRET:dGFpbG9ybHktbG9jYWwtZGV2ZWxvcG1lbnQta2V5ISE=}
    # Idem para a chave de criptografia de segredos; outros perfis exigem TAILORLY_SECRETS_KEY.
    secrets-key: ${TAILORLY_SECRETS_KEY:tailorly-local-development-secrets-key}
  # No perfil local o SearXNG do compose.yaml (docker compose up -d searxng) já é o padrão.
  web-search:
    searxng-url: ${TAILORLY_SEARXNG_URL:http://127.0.0.1:8888}
