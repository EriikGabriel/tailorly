logging:
  level:
    # A autenticação usa um AuthenticationProvider próprio (JWT), não um UserDetailsService; o
    # warning do Spring Security a cada start é esperado e não indica um problema de config.
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
spring:
  application:
    name: tailorly-api
  messages:
    basename: messages,ValidationMessages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    locale: en
    locale-resolver: accept-header
  datasource:
    url: jdbc:postgresql://localhost:5432/tailorly
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  servlet:
    multipart:
      max-file-size: 7MB
      max-request-size: 8MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        type:
          json_format_mapper: com.tailorly.api.shared.config.JacksonJsonValueFormatMapper
  flyway:
    baseline-on-migrate: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  paths-to-match: /v1/**
  writer-with-order-by-keys: true
  # Explícito para não disparar o warning de "enabled by default" a cada start; desative em
  # produção com TAILORLY_API_DOCS_ENABLED=false.
  api-docs:
    enabled: ${TAILORLY_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${TAILORLY_API_DOCS_ENABLED:true}
    display-operation-id: true
tailorly:
  extraction:
    enabled: ${TAILORLY_EXTRACTION_ENABLED:true}
    tesseract-command: ${TAILORLY_TESSERACT_COMMAND:tesseract}
    ocr-languages: ${TAILORLY_OCR_LANGUAGES:por+eng}
    ocr-revision: ${TAILORLY_OCR_REVISION:local-1}
    poll-delay-ms: 2000
  interpretation:
    # rules (sem IA)
    # remote (só provedor remoto)
    # remote-with-ollama-fallback (recomendado: remoto com fallback automático para o Ollama local)
    # ollama-only (só o Ollama local, sem chamada remota)
    provider: ${TAILORLY_INTERPRETATION_PROVIDER:rules}
    # Qualquer serviço compatível com o formato Chat Completions da OpenAI funciona aqui: OpenAI, Anthropic, DeepSeek, OpenRouter etc. Não há configuração específica por fabricante, só endpoint/modelo/chave.
    remote:
      endpoint: ${TAILORLY_REMOTE_ENDPOINT:https://api.openai.com/v1/chat/completions}
      model: ${TAILORLY_REMOTE_MODEL:}
      api-key: ${TAILORLY_REMOTE_API_KEY:}
    ollama:
      endpoint: ${TAILORLY_OLLAMA_ENDPOINT:http://127.0.0.1:11434/v1/chat/completions}
      model: ${TAILORLY_OLLAMA_MODEL:qwen3:8b}
      api-key: ${TAILORLY_OLLAMA_API_KEY:ollama}
  # Visitantes sem conta: sessão emitida e autenticada pelo servidor, com dados temporários (TTL) e
  # limites aplicados no servidor. O processamento usa sempre a IA configurada nas variáveis
  # tailorly.interpretation.* acima, nunca preferências de conta.
  anonymous:
    session-ttl: ${TAILORLY_ANONYMOUS_SESSION_TTL:PT24H}
    max-file-bytes: ${TAILORLY_ANONYMOUS_MAX_FILE_BYTES:3145728}
    max-pages: ${TAILORLY_ANONYMOUS_MAX_PAGES:3}
    max-uploads: ${TAILORLY_ANONYMOUS_MAX_UPLOADS:3}
    max-extractions: ${TAILORLY_ANONYMOUS_MAX_EXTRACTIONS:3}
    max-generations: ${TAILORLY_ANONYMOUS_MAX_GENERATIONS:3}
    max-job-postings: ${TAILORLY_ANONYMOUS_MAX_JOB_POSTINGS:10}
    requests-per-minute: ${TAILORLY_ANONYMOUS_REQUESTS_PER_MINUTE:300}
    sessions-per-ip-per-hour: ${TAILORLY_ANONYMOUS_SESSIONS_PER_IP_PER_HOUR:10}
    max-active-sessions: ${TAILORLY_ANONYMOUS_MAX_ACTIVE_SESSIONS:1000}
    cleanup-interval: ${TAILORLY_ANONYMOUS_CLEANUP_INTERVAL:PT5M}
    cleanup-enabled: ${TAILORLY_ANONYMOUS_CLEANUP_ENABLED:true}
  # Retenção de contas: depois que uma conta fica desativada (PATCH /v1/users/{id}/disable) por
  # mais que retention-period, o job de retenção apaga o currículo base, os snapshots, as vagas e
  # os currículos gerados do owner da conta. A linha de users/owners continua existindo, desativada.
  account:
    retention-period: ${TAILORLY_ACCOUNT_RETENTION_PERIOD:P30D}
    cleanup-interval: ${TAILORLY_ACCOUNT_CLEANUP_INTERVAL:P1D}
    cleanup-enabled: ${TAILORLY_ACCOUNT_CLEANUP_ENABLED:true}
  # Geração de currículos: o PDF é compilado pelo CLI do Typst (https://typst.app), que precisa estar
  # instalado no host da API. Sem ele, POST /v1/cv/generate responde 503 e nada é gravado.
  generation:
    typst-command: ${TAILORLY_TYPST_COMMAND:typst}
  # Exportação opcional dos currículos gerados para uma pasta local (por exemplo um vault Obsidian
  # como o Second Brain, em B03 Resources/CVs). Desligada por padrão; nunca escreve automaticamente
  # no vault pessoal de alguém sem que a própria pessoa aponte TAILORLY_VAULT_PATH para lá. Só
  # exporta gerações de contas (nunca de sessões anônimas) e nunca sobrescreve o objeto no Garage.
  vault:
    enabled: ${TAILORLY_VAULT_ENABLED:false}
    path: ${TAILORLY_VAULT_PATH:}
    subfolder: ${TAILORLY_VAULT_SUBFOLDER:B03 Resources/CVs}
  storage:
    endpoint: ${TAILORLY_STORAGE_ENDPOINT:http://localhost:3900}
    region: ${TAILORLY_STORAGE_REGION:garage}
    bucket: ${TAILORLY_STORAGE_BUCKET:tailorly-private}
    access-key: ${TAILORLY_STORAGE_ACCESS_KEY:}
    secret-key: ${TAILORLY_STORAGE_SECRET_KEY:}
    path-style: ${TAILORLY_STORAGE_PATH_STYLE:true}
  security:
    admin-emails: ${TAILORLY_ADMIN_EMAILS:}
    cors:
      # Origens do frontend aceitas em /v1/**; separe várias por vírgula (por exemplo, para
      # incluir o preview do Vite usado pelos testes e2e, http://127.0.0.1:4173).
      allowed-origins: ${TAILORLY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
    jwt:
      secret: ${TAILORLY_JWT_SECRET}
      issuer: ${TAILORLY_JWT_ISSUER:http://localhost:8080}
      ttl: PT1H
    # Refresh token opaco e rotativo (POST /v1/auth/refresh); revogado em POST /v1/auth/logout ou
    # DELETE /v1/me/sessions/{id}. Reuso de um token já rotacionado revoga todas as sessões da conta.
    refresh:
      ttl: ${TAILORLY_REFRESH_TTL:P30D}
    # Criptografa chaves de API de provedores de IA guardadas por conta (ai_preferences).
    secrets-key: ${TAILORLY_SECRETS_KEY}
