spring:
  application:
    name: tailorly-api
  messages:
    basename: messages,ValidationMessages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    locale: en
    locale-resolver: accept-header
  datasource:
    url: jdbc:postgresql://localhost:5432/tailorly
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  servlet:
    multipart:
      max-file-size: 7MB
      max-request-size: 8MB
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  paths-to-match: /v1/**
  writer-with-order-by-keys: true
  swagger-ui:
    display-operation-id: true
tailorly:
  extraction:
    enabled: ${TAILORLY_EXTRACTION_ENABLED:true}
    tesseract-command: ${TAILORLY_TESSERACT_COMMAND:tesseract}
    ocr-languages: ${TAILORLY_OCR_LANGUAGES:por+eng}
    ocr-revision: ${TAILORLY_OCR_REVISION:local-1}
    poll-delay-ms: 2000
  interpretation:
    provider: ${TAILORLY_INTERPRETATION_PROVIDER:rules}
    openai:
      endpoint: ${TAILORLY_OPENAI_ENDPOINT:https://api.openai.com/v1/chat/completions}
      model: ${TAILORLY_OPENAI_MODEL:}
      api-key: ${TAILORLY_OPENAI_API_KEY:}
    ollama:
      endpoint: ${TAILORLY_OLLAMA_ENDPOINT:http://127.0.0.1:11434/v1/chat/completions}
      model: ${TAILORLY_OLLAMA_MODEL:qwen3:8b}
      api-key: ${TAILORLY_OLLAMA_API_KEY:ollama}
  storage:
    endpoint: ${TAILORLY_STORAGE_ENDPOINT:http://localhost:3900}
    region: ${TAILORLY_STORAGE_REGION:garage}
    bucket: ${TAILORLY_STORAGE_BUCKET:tailorly-private}
    access-key: ${TAILORLY_STORAGE_ACCESS_KEY:}
    secret-key: ${TAILORLY_STORAGE_SECRET_KEY:}
    path-style: ${TAILORLY_STORAGE_PATH_STYLE:true}
  security:
    admin-emails: ${TAILORLY_ADMIN_EMAILS:}
    jwt:
      secret: ${TAILORLY_JWT_SECRET}
      issuer: ${TAILORLY_JWT_ISSUER:http://localhost:8080}
      ttl: PT1H
