services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tailorly
      POSTGRES_USER: tailorly
      POSTGRES_PASSWORD: tailorly
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tailorly -d tailorly"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tailorly
      MINIO_ROOT_PASSWORD: tailorly-dev-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
