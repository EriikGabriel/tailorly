services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tailorly
      POSTGRES_USER: tailorly
      POSTGRES_PASSWORD: tailorly
    ports:
      - "127.0.0.1:${TAILORLY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tailorly -d tailorly"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.4.1
    command: /garage server --single-node --default-bucket
    env_file:
      - ./services/api/.env.garage
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - ./services/api/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  garage-ui:
    image: noooste/garage-ui:v0.12.1
    depends_on:
      - garage
    env_file:
      - ./services/api/.env.garage
    environment:
      GARAGE_UI_SERVER_HOST: 0.0.0.0
      GARAGE_UI_SERVER_PORT: "8080"
      GARAGE_UI_GARAGE_ENDPOINT: http://garage:3900
      GARAGE_UI_GARAGE_ADMIN_ENDPOINT: http://garage:3903
      GARAGE_UI_GARAGE_REGION: garage
      GARAGE_UI_AUTH_TOKEN_ENABLED: "true"
    ports:
      - "127.0.0.1:3909:8080"
    restart: unless-stopped

  # Busca web local e gratuita para o enriquecimento de projetos (ver README, fase 5). Só responde em
  # 127.0.0.1. Para o Tailorly usá-lo, defina TAILORLY_SEARXNG_URL=http://127.0.0.1:8888.
  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${TAILORLY_SEARXNG_SECRET:-local-only-change-me}
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./services/searxng:/etc/searxng
    restart: unless-stopped

volumes:
  postgres-data:
  garage-meta:
  garage-data:
