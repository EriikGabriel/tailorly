version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: maven
    directory: /services/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      api-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /services/api
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
