name: Deploy

# Produção da API: container na VM Oracle Cloud (arm64). Roda depois que o CI passa na main, ou
# manualmente (Actions → Deploy → Run workflow). O frontend é publicado pela integração Git da Vercel.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # Mesmo commit que o CI aprovou (no disparo manual, o commit atual da branch).
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  api-image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - id: meta
        name: Name the image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "repo=ghcr.io/${owner}/tailorly-api" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/tailorly-api:${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # O Maven roda nativo no runner; só o estágio final (apt + Typst) é emulado para arm64.
      - uses: docker/build-push-action@v6
        with:
          context: services/api
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  api-deploy:
    needs: api-image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Assemble the server bundle
        run: |
          mkdir -p bundle/searxng
          cp deploy/oracle/compose.yaml deploy/oracle/Caddyfile bundle/
          cp services/searxng/settings.yml bundle/searxng/

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload compose, Caddyfile and SearXNG settings
        env:
          TARGET: ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy "$TARGET" 'mkdir -p ~/tailorly/searxng && test -f ~/tailorly/.env' \
            || { echo "::error::~/tailorly/.env não existe na VM (ver docs/deploy.md)"; exit 1; }
          scp -i ~/.ssh/id_deploy -r bundle/. "$TARGET:~/tailorly/"

      - name: Pull the new image and restart
        env:
          TARGET: ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}
          IMAGE: ${{ needs.api-image.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # O token vai pela entrada padrão, nunca na linha de comando remota (visível em `ps`).
          printf '%s\n' "$GHCR_TOKEN" \
            | ssh -i ~/.ssh/id_deploy "$TARGET" "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          ssh -i ~/.ssh/id_deploy "$TARGET" bash -se -- "$IMAGE" <<'REMOTE'
            image="$1"
            cd ~/tailorly
            # Registra a tag do commit no .env: um `docker compose up` manual depois usa a mesma versão.
            if grep -q '^TAILORLY_API_IMAGE=' .env; then
              sed -i "s|^TAILORLY_API_IMAGE=.*|TAILORLY_API_IMAGE=${image}|" .env
            else
              echo "TAILORLY_API_IMAGE=${image}" >> .env
            fi
            trap 'docker logout ghcr.io >/dev/null' EXIT
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          REMOTE

      - name: Wait for the API to report healthy
        env:
          API_DOMAIN: ${{ vars.TAILORLY_API_DOMAIN }}
        run: |
          # JVM + Flyway no Neon (que pode estar suspenso) levam alguns segundos na VM ARM.
          for attempt in $(seq 1 36); do
            if curl -fsS "https://${API_DOMAIN}/actuator/health" | grep -q '"status":"UP"'; then
              echo "API saudável"; exit 0
            fi
            sleep 5
          done
          echo "::error::A API não respondeu UP em 3 minutos"
          exit 1
